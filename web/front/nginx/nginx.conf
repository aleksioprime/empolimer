# Фронтенд и прокси к API на одном домене: браузер ходит только сюда (без CORS).
# TLS и домен - на стороне Coolify (Traefik).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Файлы сборки с хешем в имени - кэшируются надолго.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # Через переменную: nginx стартует, даже если бэкенд ещё не запущен, и находит его после перезапуска.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # WebSocket: сервер шлёт данные минимум раз в 30 с
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        access_log off;
        expires 1d;
        try_files $uri =404;
    }
}
