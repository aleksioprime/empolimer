; Сборка прошивки PlatformIO: pio run -e nodemcu -t upload
; В Arduino IDE откройте firmware/empolimer/empolimer.ino (см. firmware/README.md).

[platformio]
src_dir = empolimer
default_envs = nodemcu, esp32

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit NeoPixel@^1.12.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

[env:nodemcu]
platform = espressif8266
board = nodemcuv2

[env:esp32]
platform = espressif32
board = esp32dev
